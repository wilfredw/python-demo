[project]
name = "fastapi-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wilfred Wang", email = "wilfred.wang@zoom.us" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
fastapi-app = "fastapi_app:main"

[[tool.uv.index]]
url = "https://artifacts.corp.zoom.us/artifactory/api/pypi/zoom-pypi-virtual/simple"
default = true

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
