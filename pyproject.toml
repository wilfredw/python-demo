[project]
name = "python-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wilfred Wang", email = "wilfred.wang@zoom.us" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
python-demo = "python_demo:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"


[[tool.uv.index]]
name = "zoom-pypi-virtual"
url = "https://artifacts.corp.zoom.us/artifactory/api/pypi/zoom-pypi-virtual/simple"
default = true


[tool.uv.workspace]
members = [
    "common-lib",
    "asyncio_event_loop",
    "fastapi_app",
]
