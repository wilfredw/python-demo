<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
  <title id="title">大型 FastAPI 项目的分层组织</title>
  <desc id="desc">展示 FastAPI app factory、APIRouter、endpoint、schema、service、domain entity、repository、ORM model 和数据库之间的关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #172033; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #617087; }
      .node { stroke-width: 1.5; rx: 14; }
      .node-title { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .node-sub { font-size: 11px; fill: #526176; text-anchor: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
      .edge-label-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 7; }
      .edge-label { font-size: 11px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .card { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1.2; rx: 15; }
      .card-title { font-size: 15px; font-weight: 700; }
      .card-copy { font-size: 12px; fill: #415068; }
      .bullet { fill: #5577d1; }
    </style>
  </defs>

  <rect width="1500" height="850" fill="#f5f7fb"/>
  <text class="title" x="42" y="48">大型 FastAPI 项目的分层组织</text>
  <text class="subtitle" x="42" y="74">请求沿 HTTP → endpoint → service → repository 流动；app factory 负责组装，三类 Model 各自守住边界。</text>

  <!-- Main request path -->
  <path class="edge" d="M160 365 H225"/>
  <path class="edge" d="M363 365 H437"/>
  <path class="edge" d="M573 365 H648"/>
  <path class="edge" d="M794 365 H868"/>
  <path class="edge" d="M1014 365 H1085"/>
  <path class="edge" d="M1239 365 H1315"/>

  <rect class="edge-label-bg" x="166" y="342" width="53" height="19"/>
  <text class="edge-label" x="192.5" y="356">HTTP</text>
  <rect class="edge-label-bg" x="367" y="342" width="67" height="19"/>
  <text class="edge-label" x="400.5" y="356">注册路由</text>
  <rect class="edge-label-bg" x="577" y="342" width="67" height="19"/>
  <text class="edge-label" x="610.5" y="356">路由匹配</text>
  <rect class="edge-label-bg" x="798" y="342" width="66" height="19"/>
  <text class="edge-label" x="831" y="356">业务调用</text>
  <rect class="edge-label-bg" x="1018" y="342" width="64" height="19"/>
  <text class="edge-label" x="1050" y="356">依赖接口</text>
  <rect class="edge-label-bg" x="1250" y="342" width="44" height="19"/>
  <text class="edge-label" x="1272" y="356">SQL</text>

  <!-- Composition and model relationships -->
  <path class="edge" d="M294 219 V330"/>
  <rect class="edge-label-bg" x="305" y="260" width="58" height="19"/>
  <text class="edge-label" x="334" y="274">组装一次</text>
  <path class="edge" d="M721 219 V330"/>
  <rect class="edge-label-bg" x="730" y="260" width="88" height="19"/>
  <text class="edge-label" x="774" y="274">校验 / 序列化</text>
  <path class="edge" d="M941 400 V500"/>
  <rect class="edge-label-bg" x="951" y="439" width="58" height="19"/>
  <text class="edge-label" x="980" y="453">业务规则</text>
  <path class="edge" d="M1162 400 V500"/>
  <rect class="edge-label-bg" x="1172" y="439" width="72" height="19"/>
  <text class="edge-label" x="1208" y="453">映射 / CRUD</text>

  <!-- Nodes -->
  <g>
    <rect class="node" x="40" y="330" width="120" height="70" fill="#fff7ed" stroke="#f3b46b"/>
    <text class="node-title" x="100" y="359">调用方</text>
    <text class="node-sub" x="100" y="380">Web / Mobile / API</text>
  </g>
  <g>
    <rect class="node" x="225" y="145" width="138" height="74" fill="#eef6ff" stroke="#8bb7ec"/>
    <text class="node-title" x="294" y="176">App Factory</text>
    <text class="node-sub" x="294" y="198">create_app()</text>
  </g>
  <g>
    <rect class="node" x="225" y="330" width="138" height="70" fill="#eaf2ff" stroke="#82a9e8"/>
    <text class="node-title" x="294" y="359">FastAPI app</text>
    <text class="node-sub" x="294" y="380">每个 worker 一个实例</text>
  </g>
  <g>
    <rect class="node" x="437" y="330" width="136" height="70" fill="#eaf2ff" stroke="#82a9e8"/>
    <text class="node-title" x="505" y="359">APIRouter</text>
    <text class="node-sub" x="505" y="380">按版本 / 资源拆分</text>
  </g>
  <g>
    <rect class="node" x="648" y="330" width="146" height="70" fill="#eaf2ff" stroke="#82a9e8"/>
    <text class="node-title" x="721" y="359">Endpoint methods</text>
    <text class="node-sub" x="721" y="380">薄 HTTP 适配器</text>
  </g>
  <g>
    <rect class="node" x="648" y="145" width="146" height="74" fill="#f0f5ff" stroke="#a6b9ef"/>
    <text class="node-title" x="721" y="176">Pydantic Schemas</text>
    <text class="node-sub" x="721" y="198">Request / Response DTO</text>
  </g>
  <g>
    <rect class="node" x="868" y="330" width="146" height="70" fill="#f2edff" stroke="#b5a2e8"/>
    <text class="node-title" x="941" y="359">Service / Use Case</text>
    <text class="node-sub" x="941" y="380">业务用例与事务边界</text>
  </g>
  <g>
    <rect class="node" x="868" y="500" width="146" height="70" fill="#f6f1ff" stroke="#c2b2ec"/>
    <text class="node-title" x="941" y="529">Domain Entities</text>
    <text class="node-sub" x="941" y="550">复杂业务时独立建模</text>
  </g>
  <g>
    <rect class="node" x="1085" y="330" width="154" height="70" fill="#fff6e9" stroke="#e9bc73"/>
    <text class="node-title" x="1162" y="359">Repository</text>
    <text class="node-sub" x="1162" y="380">接口 + 持久化适配器</text>
  </g>
  <g>
    <rect class="node" x="1085" y="500" width="154" height="70" fill="#edf8f1" stroke="#8fc9a3"/>
    <text class="node-title" x="1162" y="529">ORM Models</text>
    <text class="node-sub" x="1162" y="550">SQLAlchemy 表映射</text>
  </g>
  <g>
    <rect class="node" x="1315" y="330" width="142" height="70" fill="#edf8f1" stroke="#8fc9a3"/>
    <text class="node-title" x="1386" y="359">数据库</text>
    <text class="node-sub" x="1386" y="380">PostgreSQL 等</text>
  </g>

  <!-- Guidance cards -->
  <g>
    <rect class="card" x="40" y="630" width="450" height="180"/>
    <circle cx="64" cy="658" r="5" fill="#5577d1"/>
    <text class="card-title" x="78" y="663">App 与路由</text>
    <circle class="bullet" cx="64" cy="692" r="3"/><text class="card-copy" x="77" y="696">main.py 暴露 app = create_app()，供 ASGI server 加载</text>
    <circle class="bullet" cx="64" cy="724" r="3"/><text class="card-copy" x="77" y="728">Factory 集中注册 router、middleware、lifespan、异常处理</text>
    <circle class="bullet" cx="64" cy="756" r="3"/><text class="card-copy" x="77" y="760">Endpoint 处理 HTTP 参数、权限依赖、状态码与响应</text>
    <circle class="bullet" cx="64" cy="788" r="3"/><text class="card-copy" x="77" y="792">业务规则和 SQL 留在下游层</text>
  </g>
  <g>
    <rect class="card" x="525" y="630" width="450" height="180"/>
    <circle cx="549" cy="658" r="5" fill="#8b6bd6"/>
    <text class="card-title" x="563" y="663">三类 Model</text>
    <circle class="bullet" cx="549" cy="692" r="3"/><text class="card-copy" x="562" y="696">Pydantic Schema：API 请求 / 响应 DTO</text>
    <circle class="bullet" cx="549" cy="724" r="3"/><text class="card-copy" x="562" y="728">Domain Entity：业务概念与规则，复杂领域再独立建模</text>
    <circle class="bullet" cx="549" cy="756" r="3"/><text class="card-copy" x="562" y="760">ORM Model：SQLAlchemy 持久化映射</text>
    <circle class="bullet" cx="549" cy="788" r="3"/><text class="card-copy" x="562" y="792">在层边界转换，避免 API 契约绑定数据库表</text>
  </g>
  <g>
    <rect class="card" x="1010" y="630" width="450" height="180"/>
    <circle cx="1034" cy="658" r="5" fill="#35a36b"/>
    <text class="card-title" x="1048" y="663">依赖与生命周期</text>
    <circle class="bullet" cx="1034" cy="692" r="3"/><text class="card-copy" x="1047" y="696">Depends 按请求提供 session，并组装 service / repository</text>
    <circle class="bullet" cx="1034" cy="724" r="3"/><text class="card-copy" x="1047" y="728">Engine、连接池等共享资源由 lifespan 管理</text>
    <circle class="bullet" cx="1034" cy="756" r="3"/><text class="card-copy" x="1047" y="760">请求之间不共享可变状态</text>
    <circle class="bullet" cx="1034" cy="788" r="3"/><text class="card-copy" x="1047" y="792">测试用 create_app() 与 dependency_overrides 隔离</text>
  </g>
</svg>
